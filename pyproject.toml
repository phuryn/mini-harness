[project]
name = "mini"
version = "1.0.5"
description = "A minimal agent harness: loop, tools, sessions, compaction, skills, MCP, subagents, /goal."
authors = [
    { name = "phuryn", email = "pawel.huryn@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=2.3.0",
    "mcp>=2.3.0",
]

[project.scripts]
mini = "mini.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
